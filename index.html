<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17100b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iNardi">
<meta name="description" content="iNardi: Armenian nardi, short and long. Play friends online, coin rooms and bots on carved wooden boards.">
<link rel="icon" href="assets/coin.webp">
<link rel="apple-touch-icon" href="assets/coin.webp">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>iNardi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-height phone screen — top player bar, scaled wooden board, bottom player bar with the roll button. Single dark walnut look. */
:root {
  --cl: url(assets/sets/classic/light.webp); --cd: url(assets/sets/classic/dark.webp); --lring: rgba(52,26,8,.92); --menubg: url(assets/skins/walnut/thumb.webp);
  --bg: #17100b;
  --bg-2: #22170f;
  --panel: #2b1d13;
  --line: rgba(216, 168, 95, .22);
  --gold: #d8a85f;
  --gold-hi: #f3d08e;
  --text: #f3e7d5;
  --muted: #b39b80;
  --chip-light: #ecdcbc;
  --chip-dark: #7a2e18;
  --glow: rgba(255, 214, 140, .95);
  --danger: #e28a6a;
  --font-display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #2e1f14 0%, var(--bg) 60%) var(--bg);
  color: var(--text); font-family: var(--font-body); overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
/* Computers and tablets: show the game as a phone-shaped column in the middle of the screen.
   The transform makes the column the frame for fixed-position layers (sheets, backgrounds). */
@media (min-width: 620px) {
  html { background: radial-gradient(70% 60% at 50% 40%, #2a1b10 0%, #0c0704 70%) #0c0704; }
  body { max-width: 460px; margin: 0 auto; position: relative; transform: translateZ(0); overflow: hidden; contain: paint;
    box-shadow: 0 0 0 1px rgba(216,168,95,.18), 0 30px 80px rgba(0,0,0,.7); }
}
@media (min-width: 620px) and (min-height: 760px) {
  html, body { height: auto; }
  body { height: min(100vh - 48px, 960px); margin-top: max(24px, calc((100vh - 960px) / 2)); border-radius: 28px; }
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.screen { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }

/* ---------- menu & rooms ---------- */
.mscreen { position: relative; isolation: isolate; padding-block: 10px 10px; }
.mscreen::before { content: ""; position: fixed; inset: -15%; z-index: -1; background: var(--menubg) center / cover; filter: blur(38px) brightness(.26) saturate(1.3); }
.mscreen::after { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(90% 55% at 50% 30%, rgba(255,180,90,.16), transparent 70%), linear-gradient(180deg, transparent 60%, rgba(0,0,0,.55)); pointer-events: none; }
.mtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; animation: rise .5s both; }
.me { display: flex; align-items: center; gap: 10px; min-width: 0; }
.me .ava { width: 42px; height: 42px; border-radius: 50%; flex: none; background: var(--cl) center / cover; box-shadow: 0 0 0 2px var(--gold), 0 4px 10px rgba(0,0,0,.5); }
.me b { display: block; font-weight: 600; font-size: 15px; }
.me small { color: var(--muted); font-size: 12px; }
.coins { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 4px 0 5px; border-radius: 20px; background: rgba(10,6,3,.6); border: 1px solid var(--line); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; flex: none; transition: transform .2s; }
.coins.bump { transform: scale(1.12); }
.coins img { width: 28px; height: 28px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
.coins .plus { width: 30px; height: 30px; border-radius: 50%; border: 0; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #2a1a0c; font-size: 20px; font-weight: 700; line-height: 1; display: grid; place-items: center; }

.hero { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; perspective: 900px; }
.hero::before { content: ""; position: absolute; width: 90%; height: 70%; background: radial-gradient(closest-side, rgba(255,190,110,.28), transparent); }
.tilt { position: absolute; left: 50%; top: 50%; translate: -50% -50%; height: min(86%, 340px); aspect-ratio: 848 / 1264; transform-style: preserve-3d;
  transform: rotateX(38deg) rotateZ(-9deg); animation: drop 1s cubic-bezier(.2,.9,.25,1) both, sway 8s ease-in-out 1.2s infinite; }
.tilt .hb { width: 100%; height: 100%; display: block; border-radius: 6px; overflow: hidden; box-shadow: 0 50px 60px -10px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.4); }
.tilt .sheen { position: absolute; inset: 0; border-radius: 6px; pointer-events: none; mix-blend-mode: screen;
  background: linear-gradient(115deg, transparent 38%, rgba(255,236,200,.42) 50%, transparent 62%) no-repeat; background-size: 260% 100%; background-position: 160% 0; animation: sheen 1.5s ease-out 1.1s both; }
@keyframes drop { from { transform: rotateX(72deg) rotateZ(-24deg) translateY(-80px) scale(.75); opacity: 0; } }
@keyframes sway { 50% { transform: rotateX(34deg) rotateZ(-6deg) translateY(-8px); } }
@keyframes sheen { to { background-position: -60% 0; } }
.hdice { position: absolute; right: 9%; bottom: 6%; display: flex; gap: 10px; z-index: 3; }
.hdice .die3 { position: relative; }
@keyframes dfall { from { transform: translateY(-260px) rotate(-200deg); opacity: 0; } 60% { opacity: 1; } }

.wordmark { flex: none; text-align: center; margin-top: -18px; position: relative; z-index: 2; }
.wordmark small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .5em; padding-left: .5em; color: var(--gold); animation: rise .7s .3s both; }
.wordmark h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(56px, 18vw, 80px); line-height: .95; letter-spacing: .04em; padding-left: .04em;
  background: linear-gradient(180deg, #fff4d8 0%, #f2cc80 42%, #b77d36 72%, #7c4e1f 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 rgba(20,10,3,.7)) drop-shadow(0 12px 22px rgba(0,0,0,.6)); animation: rise .8s .4s both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

.mode { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 290px; margin: 12px auto 0; height: 44px; padding: 4px; box-sizing: border-box; flex: none;
  border-radius: 22px; background: rgba(8,5,2,.65); box-shadow: inset 0 2px 6px rgba(0,0,0,.75), 0 1px 0 rgba(255,220,160,.1); animation: rise .6s .5s both; }
.mode .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 18px; background: url(assets/btn_brass.webp) center / cover;
  box-shadow: 0 2px 6px rgba(0,0,0,.6); transition: transform .35s cubic-bezier(.3,.8,.3,1); }
.mode[data-v="long"] .thumb { transform: translateX(100%); }
.mode button { position: relative; z-index: 1; border: 0; background: none; font-weight: 700; font-size: 13px; letter-spacing: .18em; color: var(--muted); transition: color .3s; }
.mode button[aria-pressed="true"] { color: #2b1906; }
.modedesc { text-align: center; color: var(--muted); font-size: 12.5px; margin: 7px 0 0; min-height: 1.3em; flex: none; animation: rise .6s .55s both; }

.actions { flex: none; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; margin: 14px auto 0; }
.bimg { position: relative; isolation: isolate; border: 0; background: none; padding: 0; border-radius: 14px; overflow: hidden; }
.bimg::before { content: ""; position: absolute; inset: 0; z-index: -1; border-style: solid; border-width: var(--bw); border-image: var(--img) var(--slice) fill / var(--bw) stretch; }
.bimg:active { transform: translateY(2px) scale(.99); }
.btn-brass { --img: url(assets/btn_brass.webp); --slice: 70; --bw: 22px; height: 72px; color: #2b1906; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  filter: drop-shadow(0 10px 16px rgba(0,0,0,.55)); animation: rise .6s .6s both; }
.btn-brass b { font-family: var(--font-display); font-weight: 400; font-size: 25px; letter-spacing: .18em; padding-left: .18em; text-shadow: 0 1px 0 rgba(255,244,210,.55); }
.btn-brass span { font-size: 11px; font-weight: 700; letter-spacing: .14em; opacity: .72; }
.btn-brass::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,250,230,.55) 50%, transparent 65%) no-repeat; background-size: 250% 100%; background-position: 200% 0; animation: shine 5s ease-in-out 2s infinite; }
@keyframes shine { 0%, 70% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-wood { --img: url(assets/btn_wood.webp); --slice: 64; --bw: 20px; height: 58px; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 9px;
  font-weight: 700; font-size: 14px; letter-spacing: .14em; filter: drop-shadow(0 8px 12px rgba(0,0,0,.5)); }
.row2 .btn-wood:nth-child(1) { animation: rise .6s .68s both; }
.row2 .btn-wood:nth-child(2) { animation: rise .6s .74s both; }
.btn-wood svg, .mnav svg, .back svg { width: 21px; height: 21px; fill: none; stroke: var(--gold-hi); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mnav { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; padding: 9px 4px 8px; border-radius: 18px;
  background: linear-gradient(180deg, rgba(46,31,20,.92), rgba(22,15,9,.96)); border: 1px solid var(--line); animation: rise .6s .82s both; }
.mnav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; position: relative; padding: 2px 0; }
.mnav svg { width: 24px; height: 24px; stroke: var(--gold); }
.mnav .badge { position: absolute; top: -5px; left: calc(50% + 6px); background: #b8452c; color: #fff; font-size: 10px; font-weight: 700; border-radius: 8px; padding: 1px 5px; box-shadow: 0 1px 3px rgba(0,0,0,.5); }

.mscreen .mtop h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; flex: 1; letter-spacing: .04em; }
.back { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: rgba(10,6,3,.6); display: grid; place-items: center; flex: none; }
.rsub { color: var(--muted); font-size: 13.5px; margin: 14px 0 0; line-height: 1.45; flex: none; animation: rise .5s .1s both; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; flex: none; }
.room { position: relative; border: 0; padding: 0; aspect-ratio: 298 / 420; max-width: 100%; background: var(--card) center / 100% 100% no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  filter: drop-shadow(0 12px 16px rgba(0,0,0,.55)); animation: rise .55s both; transition: transform .2s; }
.room:active { transform: scale(.97); }
.room:nth-child(2) { animation-delay: .08s; } .room:nth-child(3) { animation-delay: .16s; }
.room .tier { font-size: 10.5px; font-weight: 700; letter-spacing: .22em; padding-left: .22em; color: var(--tc); margin-top: 18%; }
.room img { width: 46%; aspect-ratio: 1; filter: drop-shadow(0 4px 5px rgba(0,0,0,.55)); }
.room b { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 7vw, 30px); color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; }
.room .prize { font-size: 11px; color: var(--muted); font-weight: 600; }
.howroom { display: grid; gap: 8px; margin-top: 18px; padding: 14px; border-radius: 14px; background: rgba(10,6,3,.5); border: 1px solid var(--line); font-size: 13px; color: var(--muted); line-height: 1.45; flex: none; animation: rise .5s .25s both; }
.howroom b { color: var(--text); }
#rooms .btn-wood { margin-top: 14px; flex: none; animation: rise .5s .3s both; }

.mini { position: relative; overflow: hidden; }
.mini-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: center / 100% 100% no-repeat; }
.mini-in img, .mini-in i { position: absolute; display: block; }
.mini-in i { border-radius: 50%; background-size: cover; box-shadow: 0 3px 5px rgba(0,0,0,.55); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; height: 42px; padding: 4px; box-sizing: border-box; border-radius: 21px; flex: none;
  background: rgba(8,5,2,.65); box-shadow: inset 0 2px 6px rgba(0,0,0,.75), 0 1px 0 rgba(255,220,160,.1); }
.tabs button { border: 0; background: none; border-radius: 17px; font-weight: 700; font-size: 13px; letter-spacing: .14em; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: url(assets/btn_brass.webp) center / cover; color: #2b1906; box-shadow: 0 2px 6px rgba(0,0,0,.6); }
.shoplist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-top: 14px; padding-bottom: 8px; }
.item { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 16px; background: rgba(10,6,3,.55); border: 1px solid var(--line); animation: rise .45s both; flex: none; }
.item:nth-child(2) { animation-delay: .06s; } .item:nth-child(3) { animation-delay: .12s; }
.item.eq { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold), 0 0 24px rgba(216,168,95,.15); }
.ithumb { flex: none; width: 92px; aspect-ratio: 848 / 1264; border-radius: 5px; box-shadow: 0 8px 14px rgba(0,0,0,.55); }
.ithumb.pair { aspect-ratio: 1; position: relative; overflow: hidden; border-radius: 12px; }
.ithumb.pair .swatch { position: absolute; inset: 0; background-size: 380%; background-position: 28% 50%; }
.ithumb.pair i { position: absolute; width: 50px; height: 50px; border-radius: 50%; background-size: cover; box-shadow: 0 4px 6px rgba(0,0,0,.6); }
.ithumb.pair i:nth-of-type(1) { left: 8px; top: 10px; } .ithumb.pair i:nth-of-type(2) { right: 8px; bottom: 10px; }
.ithumb.pair i.ring { box-shadow: 0 0 0 2px rgba(52,26,8,.9), 0 4px 6px rgba(0,0,0,.6); }
.iinfo { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; align-items: flex-start; }
.iinfo b { font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.1; }
.iinfo span { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.ibtn { margin-top: 6px; height: 38px; padding: 0 16px; border-radius: 19px; border: 0; font-weight: 700; font-size: 13px; letter-spacing: .08em; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.ibtn.buy { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #2a1a0c; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.ibtn.buy img { width: 20px; height: 20px; }
.ibtn.equip { background: #1b130c; border: 1px solid var(--gold); color: var(--gold-hi); }
.ibtn.done { background: transparent; color: var(--gold); padding: 0; }
.ibtn.done::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.ithumb.mini { position: relative; cursor: pointer; }
.ithumb.mini::after { content: "3D"; position: absolute; right: 5px; bottom: 5px; padding: 3px 6px; border-radius: 6px; background: rgba(10,6,3,.82); border: 1px solid var(--gold); color: var(--gold-hi); font: 700 10px/1 system-ui, sans-serif; letter-spacing: .06em; }
/* 3D board viewer */
#viewer { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: radial-gradient(120% 70% at 50% 42%, #3a2616 0%, #1a110a 48%, #070403 100%); color: var(--text); }
#viewer[hidden] { display: none !important; }
#v3d { position: absolute; inset: 0; touch-action: none; cursor: grab; }
#v3d:active { cursor: grabbing; }
#v3d canvas { display: block; width: 100%; height: 100%; }
.vtop { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0; pointer-events: none; }
.vtop > * { pointer-events: auto; }
.vtop .vt { min-width: 0; }
.vtop b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.vtop span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.vreset { margin-left: auto; }
.vreset svg, #viewer .back svg { width: 20px; height: 20px; fill: none; stroke: var(--gold-hi); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.vbot { position: relative; z-index: 1; margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 22px); pointer-events: none; }
.vbot > * { pointer-events: auto; }
.vhint { font-size: 12.5px; letter-spacing: .04em; color: var(--muted); text-align: center; text-shadow: 0 1px 2px #000; pointer-events: none !important; }
.vbot .ibtn { height: 50px; padding: 0 30px; border-radius: 25px; font-size: 15px; margin: 0; }
.vbot .ibtn.done { padding: 0 6px; }
.vload { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); color: var(--muted); font-size: 13px; letter-spacing: .08em; }
.packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pack { border: 1px solid var(--line); background: #1b130c; border-radius: 14px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pack img { width: 34px; height: 34px; }
.pack small { color: var(--muted); font-weight: 600; font-size: 11px; }
.pbar { position: relative; overflow: hidden; }
.pbar .tbar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; transform-origin: left; transform: scaleX(var(--t, 0)); background: linear-gradient(90deg, var(--gold), var(--gold-hi)); opacity: 0; transition: opacity .3s; }
.pbar.active.timed .tbar { opacity: 1; }
.pbar.low .tbar { background: linear-gradient(90deg, #c4472c, #ff9b78); }
.pbar.online .score { display: none; }
.sheet .code { font-family: var(--font-display); font-size: 40px; letter-spacing: .28em; padding-left: .28em; text-align: center; color: var(--gold-hi); margin: 2px 0; user-select: all; -webkit-user-select: all; }
.sheet .linkbox { font-size: 12px; color: var(--muted); text-align: center; word-break: break-all; user-select: all; -webkit-user-select: all; }
.sheet input.codein { width: 100%; box-sizing: border-box; height: 56px; border-radius: 12px; border: 1px solid var(--gold); background: #1b130c; color: var(--gold-hi);
  font-family: var(--font-display); font-size: 30px; letter-spacing: .3em; text-align: center; text-transform: uppercase; }
.sheet input.namein { width: 100%; box-sizing: border-box; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: #1b130c; color: var(--text); font: 600 17px var(--font-body); padding: 0 14px; }
.sheet .err { color: #ff9b78; min-height: 1.2em; font-size: 13px; }
.spin { width: 54px; height: 54px; margin: 6px auto; border-radius: 50%; border: 4px solid rgba(216,168,95,.2); border-top-color: var(--gold-hi); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.netdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6b5a45; margin-right: 6px; vertical-align: 1px; }
.netdot.on { background: #6fd18b; box-shadow: 0 0 6px #6fd18b; }

/* ---------- studio intro: Each Pixel Matters ---------- */
.studio { position: fixed; inset: 0; z-index: 200; background: #1A1A1A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; transition: opacity .5s ease; cursor: pointer; }
.studio.out { opacity: 0; pointer-events: none; }
.st-logo svg { display: block; width: min(56vw, 230px); height: auto; overflow: visible; }
.st-logo svg * { transform-box: fill-box; transform-origin: center; }
.st-logo .a-e { animation: stL .62s cubic-bezier(.2,1.35,.4,1) .15s both; }
.st-logo .a-p { animation: stT .62s cubic-bezier(.2,1.35,.4,1) .32s both; }
.st-logo .a-m { animation: stB .62s cubic-bezier(.2,1.35,.4,1) .49s both; }
.st-logo .a-gold { animation: stDrop .75s cubic-bezier(.3,1.55,.45,1) .95s both, stGlow 1.3s ease-out 1.5s both; }
.st-logo .a-each { animation: stU .5s ease-out 1.3s both; }
.st-logo .a-cell { animation: stPop .22s cubic-bezier(.3,1.6,.5,1) both; }
.st-logo .a-pix { animation: stFade .2s linear 2.05s both; }
.st-logo .a-mat { animation: stU .45s ease-out both; }

<script>
(() => {
'use strict';
const N = window.Nardi, Bot = window.NardiBot;
const $ = id => document.getElementById(id);

// ---------- skins & board geometry (board image units) ----------
// Each board image is 848 × 1264 and mirrored left-to-right, so the right field is the left one reflected.
const SKINS = {
  walnut: { name: 'Ararat Walnut', desc: 'Carved vines and pomegranates with Mount Ararat medallions.', price: 0, W: 848, H: 1264, L: [83, 392], top: 84, bot: 1180, dim: .82, dice: 'ivory', hero3d: 'assets/skins/walnut/hero3d.webp' },
  oak:    { name: 'Golden Oak', desc: 'Light oak, apricot-wood inlay and carved pomegranate branches.', price: 400, W: 848, H: 1264, L: [70, 397], top: 70, bot: 1206, dim: 1, dice: 'wood' },
  ebony:  { name: 'Pearl Ebony', desc: 'Black ebony inlaid with mother-of-pearl and gold.', price: 900, W: 848, H: 1264, L: [60, 392], top: 55, bot: 1196, dim: .86, dice: 'pearl' },
};
for (const k in SKINS) { const sk = SKINS[k]; sk.id = k; sk.R = [sk.W - sk.L[1], sk.W - sk.L[0]]; }
const SETS = {
  classic: { name: 'Ivory & Mahogany', desc: 'The classic pair. Polished ivory and red mahogany.', price: 0, ring: true },
  bone:    { name: 'Bone & Walnut', desc: 'Cream bone with a walnut rim, and dark walnut.', price: 200, ring: false },
  pearl:   { name: 'Pearl & Garnet', desc: 'Mother-of-pearl and garnet lacquer, gold rims.', price: 500, ring: true },
};
const A = (skin, part) => `assets/skins/${skin}/${part}.webp`, SA = (set, part) => `assets/sets/${set}/${part}.webp`;
let SK, BW = 848, BH = 1264, C = 46, FIELD, TOPY, BOTY, MIDY, PTLEN, BARX, COLW, MAXLEN, EMB, OFFX;
const colX = c => c < 6 ? FIELD.L[0] + (c + .5) * COLW : FIELD.R[0] + (c - 6 + .5) * COLW;
const absCol = a => a % 12, absTop = a => a < 12;

// ---------- persistent prefs ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('nardi.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('nardi.' + k, JSON.stringify(v)); } catch {} }
};
let owned = store.get('owned', { skins: ['walnut'], sets: ['classic'] }), equip = store.get('equip', { skin: 'walnut', set: 'classic' });
if (!SKINS[equip.skin]) equip.skin = 'walnut'; if (!SETS[equip.set]) equip.set = 'classic';
let prefs = { scene: store.get('scene', 'auto'), variant: store.get('variant', 'short'), opp: store.get('opp', 'normal'), sound: store.get('sound', true) };

// ---------- sound (synthesized) ----------
let ac = null;
function audio() { if (!prefs.sound) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch { ac = null; } return ac; }
function knock(t, freq, gain, len) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * len), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.4;
  const g = a.createGain(); g.gain.value = gain;
  src.connect(f).connect(g).connect(a.destination); src.start(a.currentTime + t);
  const o = a.createOscillator(), og = a.createGain(); o.frequency.value = freq / 9;
  og.gain.setValueAtTime(gain * .5, a.currentTime + t); og.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .09);
  o.connect(og).connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + .1);
}
// recorded sound effects: decoded once, played through the same audio context (falls back to synthesized sounds until loaded)
// each sound can have several recorded variations; one is picked at random (never the same one twice in a row)
const SAMPLES = {
  dice: ['assets/sfx/dice-shuffle.mp3'],
  land: ['assets/sfx/land-1.mp3', 'assets/sfx/land-2.mp3', 'assets/sfx/land-3.mp3'],
  place: ['assets/sfx/place-1.mp3', 'assets/sfx/place-2.mp3', 'assets/sfx/place-3.mp3', 'assets/sfx/place-4.mp3'],
  slide: ['assets/sfx/slide-1.mp3', 'assets/sfx/slide-2.mp3', 'assets/sfx/slide-3.mp3', 'assets/sfx/slide-4.mp3'],
  bearoff: ['assets/sfx/bearoff-1.mp3', 'assets/sfx/bearoff-2.mp3', 'assets/sfx/bearoff-3.mp3'],
  tap: ['assets/sfx/tap-1.mp3', 'assets/sfx/tap-2.mp3'],
  button: ['assets/sfx/button-1.mp3'],
  switch: ['assets/sfx/switch-1.mp3', 'assets/sfx/switch-2.mp3', 'assets/sfx/switch-3.mp3'],
  popup: ['assets/sfx/popup-1.mp3', 'assets/sfx/popup-2.mp3'],
  back: ['assets/sfx/back-1.mp3'],
  yourturn: ['assets/sfx/yourturn-1.mp3'], matchfound: ['assets/sfx/matchfound-1.mp3'], win: ['assets/sfx/win-1.mp3'],
  lose: ['assets/sfx/lose-1.mp3'], tick: ['assets/sfx/tick-1.mp3'], invalid: ['assets/sfx/invalid-1.mp3'],
};
// per-file level so variations sound equally loud (the slides differ a lot in how long and dense they are)
const SAMPLE_GAIN = { 'assets/sfx/slide-2.mp3': .22, 'assets/sfx/slide-3.mp3': .22, 'assets/sfx/slide-4.mp3': .26 };
const sampleBuf = {}, lastPick = {};
let samplesLoading = false;
function loadSamples() {
  const a = audio(); if (!a || samplesLoading) return; samplesLoading = true;
  for (const urls of Object.values(SAMPLES)) for (const url of urls)
    fetch(url).then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => a.decodeAudioData(b, ok, no))).then(buf => { sampleBuf[url] = buf; }).catch(() => {});
}
// opts: gain, rate (default: small random pitch change), dur (stop after this many seconds with a short fade)
function playSample(k, gain = 1, opts = {}) {
  const a = audio(); if (!a) return false;
  const ready = (SAMPLES[k] || []).filter(u => sampleBuf[u]);
  if (!ready.length) { loadSamples(); return false; }
  let i = Math.floor(Math.random() * ready.length);
  if (ready.length > 1 && ready[i] === lastPick[k]) i = (i + 1) % ready.length;
  const url = ready[i]; lastPick[k] = url;
  const src = a.createBufferSource(), g = a.createGain(), t = a.currentTime;
  src.buffer = sampleBuf[url]; g.gain.value = gain * (SAMPLE_GAIN[url] ?? 1);
  src.playbackRate.value = opts.rate || (.95 + Math.random() * .1);
  src.connect(g).connect(a.destination); src.start(t);
  if (opts.dur) { g.gain.setValueAtTime(g.gain.value, t + opts.dur - .08); g.gain.linearRampToValueAtTime(0, t + opts.dur); src.stop(t + opts.dur + .02); }
  return true;
}
document.addEventListener('pointerdown', () => loadSamples(), { once: true, capture: true });
document.addEventListener('click', e => {
  const t = e.target.closest('button, a, .room, .opt, .pack'); if (!t || t.disabled) return;
  if (t.id === 'rollBtn' || t.closest('#boardWrap')) return;                     // dice and checkers have their own sounds
  if (t.matches('[data-act="close"]')) return;                                   // closing a sheet plays the close sound
  lastBtnSound = performance.now();
  if (t.matches('.back')) return sfx.back();
  if (t.closest('#mode, .tabs') || t.matches('[data-act="sound"], [data-act="scene"]')) return sfx.toggle();
  if (t.matches('.btn-brass, .btn-wood, .cta, .room, .pack, .opt')) return sfx.button();
  sfx.tap();
}, true);
const sfx = {
  place() { if (!playSample('place', .9)) knock(0, 1500, .9, .06); },
  slide() { playSample('slide', .55); },
  bearoff() { if (!playSample('bearoff', .85)) knock(0, 1500, .9, .06); },
  land() { if (!playSample('land', .8)) knock(0, 1800, .7, .05); },
  ui() { knock(0, 1500, .6, .05); },
  tap() { playSample('tap', .6, { rate: 1 }) || knock(0, 1500, .5, .04); },
  button() { playSample('button', .35, { rate: 1 }) || knock(0, 1300, .6, .05); },
  toggle() { playSample('switch', .7, { rate: 1 }) || knock(0, 1700, .5, .04); },
  popup() { playSample('popup', .32, { rate: 1 }); },
  back() { playSample('back', .38, { rate: 1 }); },
  lose() { playSample('lose', .45, { rate: 1 }); },
  yourTurn() { playSample('yourturn', .4, { rate: 1 }); },
  matchFound() { playSample('matchfound', .55, { rate: 1 }); },
  tick() { playSample('tick', .55, { rate: 1 }); },
  invalid() { playSample('invalid', .45, { rate: 1 }); },
  dice() { if (!playSample('dice', .8, { dur: .62 })) for (let i = 0; i < 7; i++) knock(i * .065 + Math.random() * .03, 2600 + Math.random() * 1200, .35 + Math.random() * .3, .035); },
  win() { if (playSample('win', .55, { rate: 1 })) return; const a = audio(); if (!a) return; [523, 659, 784, 1046].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.0001, a.currentTime + i * .12); g.gain.exponentialRampToValueAtTime(.18, a.currentTime + i * .12 + .02); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + i * .12 + .5); o.connect(g).connect(a.destination); o.start(a.currentTime + i * .12); o.stop(a.currentTime + i * .12 + .55); }); }
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

// ---------- game state ----------
const G = { variant: 'short', opp: 'normal', s: null, p: 0, turn: null, phase: 'idle', score: [0, 0], ops: [], busy: false, sel: null, rolled: null, timers: [] };
const isBot = p => G.opp !== 'local' && G.opp !== 'online' && p === 1;
const canAct = p => G.opp === 'online' ? (G.online && p === G.online.seat) : !isBot(p);
let FLIP = 0;   // 1 when I am seat 1 online: the board is shown rotated so my checkers are at the bottom
const names = () => G.opp === 'online' ? [G.online.g.p0_name || 'Player', G.online.g.p1_name || 'Player']
  : G.opp === 'local' ? ['Light', 'Dark'] : ['You', G.opp === 'easy' ? 'Bot · Easy' : 'Bot · Hard'];
const later = (fn, ms) => { const t = setTimeout(fn, ms); G.timers.push(t); return t; };
const sleep = ms => new Promise(r => later(r, ms));
let gameId = 0;

// ---------- board DOM ----------
const board = $('board'), wrap = $('boardWrap');
let scale = 1;
function fit() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  scale = Math.min(w / BW, h / BH);
  board.style.transform = `translate(${(w - BW * scale) / 2}px, ${(h - BH * scale) / 2}px) scale(${scale})`;
}
new ResizeObserver(fit).observe(wrap);

function applySkin() {
  SK = SKINS[equip.skin] || SKINS.walnut;
  BW = SK.W; BH = SK.H; FIELD = { L: SK.L, R: SK.R }; TOPY = SK.top; BOTY = SK.bot; MIDY = (TOPY + BOTY) / 2;
  COLW = (FIELD.L[1] - FIELD.L[0]) / 6; C = Math.round(COLW * .9); PTLEN = Math.round((BOTY - TOPY) * .4);
  MAXLEN = Math.round((BOTY - TOPY) * .46); BARX = BW / 2; EMB = Math.round((FIELD.L[1] - FIELD.L[0]) * .72);
  OFFX = [FIELD.L[0] / 2, (FIELD.R[1] + BW) / 2];
  board.style.width = BW + 'px'; board.style.height = BH + 'px'; board.style.backgroundImage = `url(${A(SK.id, 'board')})`;
  wrap.style.aspectRatio = BW + ' / ' + BH;
  board.style.setProperty('--c', C + 'px'); board.style.setProperty('--dim', SK.dim);
  setVars();
}
function buildStatic() {
  board.innerHTML = '';
  for (let a = 0; a < 24; a++) {
    const img = document.createElement('img'), top = absTop(a), c = absCol(a);
    const dk = (c + (top ? 0 : 1)) % 2 === 0; img.className = 'pt' + (dk ? '' : ' lt'); img.alt = '';
    img.src = A(SK.id, dk ? 'point_dark' : 'point_light');
    const pw = COLW * .94; img.style.width = pw + 'px'; img.style.height = PTLEN + 'px';
    img.style.left = (colX(c) - pw / 2) + 'px';
    img.style.top = (top ? TOPY : BOTY - PTLEN) + 'px';
    if (top) img.style.transform = 'rotate(180deg)';
    board.appendChild(img);
  }
  for (const f of [FIELD.L, FIELD.R]) {
    const e = document.createElement('img'); e.className = 'emb'; e.alt = ''; e.src = A(SK.id, 'emblem');
    e.style.width = e.style.height = EMB + 'px';
    e.style.left = ((f[0] + f[1]) / 2 - EMB / 2) + 'px'; e.style.top = (MIDY - EMB / 2) + 'px'; board.appendChild(e);
  }
}

// locations: 'a0'..'a23' (absolute points), 'bar0','bar1','off0','off1' → arrays of checker elements
let locs = {};
const locKey = (p, i) => i === -1 ? 'bar' + p : i === 24 ? 'off' + p : 'a' + (FLIP ? 23 - N.PATH[G.variant][p][i] : N.PATH[G.variant][p][i]);

function placeAll() {
  board.querySelectorAll('.checker,.target,.lane').forEach(e => e.remove());
  locs = {}; for (let a = 0; a < 24; a++) locs['a' + a] = [];
  for (const k of ['bar0', 'bar1', 'off0', 'off1']) locs[k] = [];
  for (const p of [0, 1]) {
    const add = (k, n) => { for (let j = 0; j < n; j++) { const el = document.createElement('div'); el.className = 'checker ' + (p ? 'dark' : 'light'); el.dataset.p = p; if (k.startsWith('off')) el.classList.add('off'); board.appendChild(el); locs[k].push(el); } };
    for (let i = 0; i < 24; i++) add(locKey(p, i), G.s.pos[p][i]);
    add('bar' + p, G.s.bar[p]); add('off' + p, G.s.off[p]);
  }
  layout();
}

function offZone(p) { // [x, yStart, dir]
  const z = p === 0 ? [OFFX[1], BOTY, -1] : G.variant === 'short' ? [OFFX[1], TOPY, 1] : [OFFX[0], TOPY, 1];
  return FLIP ? [BW - z[0], z[1] === BOTY ? TOPY : BOTY, -z[2]] : z;
}
function slotPos(k, idx, n) {
  if (k[0] === 'a') {
    const a = +k.slice(1), x = colX(absCol(a)), maxLen = MAXLEN;
    const step = n * C <= maxLen ? C : (maxLen - C) / (n - 1);
    return absTop(a) ? [x, TOPY + C / 2 + 3 + idx * step] : [x, BOTY - C / 2 - 3 - idx * step];
  }
  if (k.startsWith('bar')) {
    const p = +k[3], step = Math.min(C, (BOTY - TOPY) * .34 / Math.max(n, 1));
    return (p ^ FLIP) === 0 ? [BARX, MIDY + C * .85 + idx * step] : [BARX, MIDY - C * .85 - idx * step];
  }
  const [x, y0, dir] = offZone(+k[3]);
  return [x, y0 + dir * (8 + idx * 13)];
}

  for (const k in locs) {
    const arr = locs[k], n = arr.length, compressed = k[0] === 'a' && n * C > MAXLEN;
    arr.forEach((el, i) => {
      const [x, y] = slotPos(k, i, n), off = el.classList.contains('off');
      const w = off ? 36 : C, h = off ? 11 : C;
      el.style.transform = `translate(${x - w / 2}px, ${y - h / 2}px)`;
      el.style.zIndex = 10 + i;
      if ((compressed || (k.startsWith('bar') && n > 1)) && i === n - 1) el.dataset.count = n; else delete el.dataset.count;
    });
  }

// ---------- dice (3D cubes) ----------

function animateMove(p, m) {

  const el = locs[fromK].pop(); let hitEl = null;
  if (m.hit) { hitEl = locs[toK].pop(); locs['bar' + (1 - p)].push(hitEl); hitEl.classList.add('moving'); later(() => hitEl.classList.remove('moving'), 420); }
  locs[toK].push(el); if (m.to === 24) el.classList.add('off');
  el.classList.add('moving'); later(() => el.classList.remove('moving'), 420);
  layout(); sfx.slide(); later(() => { (m.to === 24 ? sfx.bearoff : sfx.place)(); buzz(8); }, 260);

}

  if (op.hitEl) { locs['bar' + (1 - op.p)].pop(); locs[op.toK].push(op.hitEl); }

// ---------- turn flow ----------
const rnd = () => 1 + Math.floor(Math.random() * 6);
async function startTurn() {
  const id = gameId;
  G.phase = 'rolling'; hud();
  const d1 = rnd(), d2 = rnd();
  await rollAnim([d1, d2]); if (id !== gameId) return;
  G.turn = new N.Turn(G.s, G.p, d1, d2); G.ops = []; G.sel = null;
  if (G.turn.total === 0) {
    G.phase = 'move'; hud(); toast('No legal moves'); await sleep(1300); if (id !== gameId) return;
    return endTurn();
  }
  G.phase = 'move'; refreshDiceUsed(); hud();
  if (isBot(G.p)) return botPlay(d1, d2, id);
  refreshHints();
}
async function botPlay(d1, d2, id) {
  await sleep(350); if (id !== gameId) return;
  const choice = Bot.chooseTurn(G.s, G.p, d1, d2, G.opp);
  for (const m of choice.moves) {
    animateMove(G.p, m); G.turn.play(m); refreshDiceUsed(); hud();
    await sleep(560); if (id !== gameId) return;
  }
  endTurn();
}
function endTurn() {
  G.busy = false; G.phase = 'ending';
  G.s = G.turn.finish(); G.turn = null; G.sel = null; refreshHints();
  const w = N.winner(G.s);
  if (w >= 0) return gameOver(w);
  G.p = 1 - G.p; G.phase = 'roll'; hud();
  if (isBot(G.p)) later(startTurn, 650);
}
function gameOver(w) {
  G.phase = 'over';
  const pts = N.resultPoints(G.s, w); G.score[w] += pts; hud();
  if (G.opp !== 'local') { stats.played++; if (w === 0) stats.won++; store.set('stats', stats); }
  if (!isBot(w)) sfx.win(); else sfx.lose();
  const nm = names(), title = G.opp === 'local' ? `${nm[w]} wins` : w === 0 ? 'You win' : 'Bot wins';
  later(() => sheet(`<h2>${title}</h2><p>${pts === 2 ? 'Mars: the other side bore off nothing, so this game counts double.' : 'A clean win.'}</p>
    <p style="font-family:var(--font-display);font-size:26px;color:var(--text)">${G.score[0]} : ${G.score[1]}</p>
