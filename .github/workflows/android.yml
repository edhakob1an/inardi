# Builds the iNardi Android app (debug APK for testing) on every push to main,
# and publishes it as the "android-latest" release so it can be downloaded to a phone.
name: Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Copy the web game into the app
        working-directory: app
        run: |
          npm ci
          node copy-web.mjs
          npx cap sync android
      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../iNardi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iNardi-apk
          path: iNardi.apk
      - name: Publish as the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: iNardi Android (test build ${{ github.run_number }})
          body: Test build of the iNardi Android app. Download iNardi.apk on your phone and open it to install.
          prerelease: true
          make_latest: false
          files: iNardi.apk
